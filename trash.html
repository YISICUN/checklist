<!-- trash.html -->

<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>回收站</title>
    <link rel="shortcut icon" href="./assets/images/favicon.ico" type="image/x-icon">
    <link rel="icon" sizes="32x32" href="./assets/images/favicon.ico">

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f7f6;
            margin: 40px;
            color: #333;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        /* 顶部首行布局：使用 Flex 左右对齐 */
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #fff;
            border-bottom: 1px solid #eee;
        }

        h2 {
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
            color: #2c3e50;
        }

        button {
            cursor: pointer;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            color: white;
        }

        .item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            margin: 8px 0;
            background: #fafafa;
            border-radius: 4px;
            border-left: 4px solid #3498db;
        }

        .spacer-style {
            height: 100px;
        }

        /* 💡 新增：手机端适配（与 index.html 保持一致） */
        @media (max-width: 600px) {
            body {
                margin: 0;
                /* 去掉手机端左右留白 */
            }

            .container {
                max-width: 100%;
                /* 宽度撑满 */
                border-radius: 0;
                /* 去掉圆角，更像原生 APP */
                box-shadow: none;
                /* 去掉阴影，减少视觉干扰 */
                min-height: 100vh;
                /* 确保背景色铺满全屏 */
            }
        }
    </style>
</head>

<body>

    <div id="app" class="container">

        <!-- 头部行：标题居左，按钮换行并靠右 -->
        <div class="header-row"
            style="display: flex; flex-direction: column; align-items: flex-start; gap: 10px; margin-bottom: 15px;">
            <h2 style="margin: 0;">🗑️ 回收站</h2>

            <div style="display: flex; gap: 10px; width: 100%; justify-content: flex-end;">
                <button @click="resetDeleteTip" style="background: #3498db; font-size: 13px;">
                    恢复删除提示
                </button>
                <button @click="goBack" style="background: #3498db; font-size: 13px;">
                    返回清单
                </button>
            </div>
        </div>

        <p v-if="loading" style="color: #3498db;">正在加载回收站数据...</p>
        <!-- 💡 视图渲染改用 filteredtodoList 判断和遍历 -->
        <p v-else-if="filteredtodoList.length === 0" style="color: #7f8c8d;">回收站是空的~</p>

        <div v-else>
            <div v-for="item in filteredtodoList" :key="item.id" class="item"
                style="flex-direction: column; align-items: stretch; gap: 8px;">
                <!-- 第一行：还原按钮 + 标题 -->
                <div style="display: flex; align-items: center; width: 100%;">
                    <div style="display: flex; gap: 8px;">
                        <button @click="restoreItem(item.id)" style="background: #3498db; padding: 4px 8px;">还原</button>
                    </div>
                    <!-- 标题靠左，margin-right: auto 把右侧空间撑开 -->
                    <span style="margin-right: auto; margin-left: 12px; font-weight: 500;">{{ item.title }}</span>
                </div>

                <!-- 第二行：最终更新时间 + 彻底删除按钮（靠右对齐） -->
                <div style="display: flex; align-items: center; justify-content: flex-end; gap: 12px; width: 100%;">
                    <span
                        style="font-size: 12px; color: #999; display: inline-flex; flex-direction: column; text-align: right;">
                        <span>最终更新时间:{{ formatTime(item.updateTime) }}</span>
                    </span>
                    <button @click="permanentDelete(item.id)"
                        style="background: #e74c3c; padding: 4px 8px;">彻底删除</button>
                </div>
            </div>
        </div>

        <!-- 底部空白占位符，防止手机底栏遮挡 -->
        <div class="spacer-style"></div>

        <!-- 💡 通用提示框 -->
        <dialog ref="msgDialog"
            style="border: none; border-radius: 8px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
            <form method="dialog" @submit.prevent="msgDialog.close()">
                <h3 style="margin-top: 0; color: #2c3e50;">提示</h3>
                <p>{{ dialogMessage }}</p>
                <div style="text-align: right; margin-top: 15px;">
                    <button type="submit" style="background: #3498db; padding: 6px 16px;">确定</button>
                </div>
            </form>
        </dialog>

    </div>
    <script src="https://unpkg.com/vue@3.5.40/dist/vue.global.js"></script>
    <script src="https://unpkg.com/axios@1.7.2/dist/axios.min.js"></script>
    <script src="js/api.js"></script>

    <script>
        const { createApp, ref, computed, onMounted, watch } = Vue;

        createApp({
            setup() {
                const todoList = ref([]);
                const loading = ref(true);
                const msgDialog = ref(null);
                const dialogMessage = ref("");

                const showDialog = (msg) => {
                    dialogMessage.value = msg;
                    msgDialog.value.showModal();
                };

                // 把全局挂载的请求工具拿过来，给它起个本地名字叫 request
                const request = window.api;

                // 💡 格式化时间函数：将 "2026-07-27T09:20:39" 转换为友好的 "2026-07-27 09:20:39"
                const formatTime = (timeStr) => {
                    if (!timeStr) return '';
                    return timeStr.replace('T', ' ');
                };

                // 💡 计算属性：根据 deleteFlag 过滤，并按更新时间倒序排序
                const filteredtodoList = computed(() => {
                    return todoList.value
                        .filter(item => Number(item.deleteFlag) === 1)
                        .sort((a, b) => {
                            const timeA = new Date(a.updateTime || 0).getTime();
                            const timeB = new Date(b.updateTime || 0).getTime();
                            return timeB - timeA; // 倒序：最新的排在最前面
                        });
                });

                // 监听 todoList 的变化，自动实现数据持久化（LocalStorage）
                watch(todoList, (newValue) => {
                    const storageKey = window.getStorageKey(); // 👈 获取当前用户的专属 Key
                    localStorage.setItem(storageKey, JSON.stringify(newValue));
                }, { deep: true });

                // 加载回收站数据：将完整数据存入 todoList，并同步到 localStorage
                const loadTrash = async () => {
                    loading.value = true;
                    const storageKey = window.getStorageKey();

                    try {
                        // 1. 优先尝试从后端获取最新的全量数据
                        const response = await request.get('/item/list');
                        if (response.data.code === 200) {
                            // 先执行一次同步（把之前断网时存的本地数据传上去）
                            await window.syncImportedDataToDB();

                            // 💡 核心：将全量数据备份到其专属的缓存 Key 中,监听 todoList 的变化，自动实现数据持久化（LocalStorage）
                            todoList.value = response.data.data;
                        } else {
                            showDialog("加载回收站失败: " + response.data.message);
                        }
                    } catch (err) {
                        console.warn("网络请求失败，正在从本地存储读取...", err);

                        // 2. 联网失败时，降级从 localStorage 的 todo_list_data_${userId} 读取全量数据
                        const localData = localStorage.getItem(storageKey);
                        if (localData) {
                            try {
                                todoList.value = JSON.parse(localData);
                                console.log("当前处于离线状态，正在显示本地缓存的数据。");
                            } catch (parseErr) {
                                console.error("解析本地数据失败", parseErr);
                                todoList.value = [];
                            }
                        } else {
                            todoList.value = [];
                            showDialog("当前无网络连接，且没有该用户的本地缓存数据。");
                        }
                    } finally {
                        loading.value = false;
                    }
                };

                // 还原任务
                const restoreItem = async (id) => {
                    try {
                        const response = await request.post(`/item/restore/${id}`).catch(() => null);
                        const target = todoList.value.find(item => item.id === id);
                        if (target) {
                            // todoList 的变化会被监听，自动实现数据持久化（LocalStorage）
                            target.deleteFlag = 0;
                        }
                        if (response && response.data.code === 200) {
                            console.log("restoreItem后端请求成功");
                        } else {
                            console.log("restoreItem后端请求失败，已通过本地 watch 自动完成离线兜底");
                        }
                    } catch (err) {
                        showDialog("网络异常，操作失败");
                    }
                };

                // 彻底删除
                const permanentDelete = async (id) => {
                    try {
                        const response = await request.post(`/item/clean/${id}`).catch(() => null);

                        // 无论后端是否成功，本地缓存也同步更新（直接从总列表中彻底移除该项）
                        // todoList 的变化会被监听，自动实现数据持久化（LocalStorage）
                        todoList.value = todoList.value.filter(item => item.id !== id);
                        if (response && response.data.code === 200) {
                            console.log("permanentDelete后端请求成功");
                        } else {
                            console.log("permanentDelete后端请求失败，已通过本地 watch 自动完成离线兜底");
                        }
                    } catch (err) {
                        showDialog("操作失败");
                    }
                };

                // 💡 核心功能：恢复删除提示（清除不再提示的本地缓存）
                const resetDeleteTip = () => {
                    localStorage.removeItem('skip_delete_confirm');
                    showDialog("已成功恢复！下次删除任务时将重新显示确认提示框。");
                };

                const goBack = () => {
                    window.location.href = 'index.html'; // 请根据你的主页面文件名调整
                };

                onMounted(() => {
                    if (!localStorage.getItem('userId')) {
                        window.location.href = 'login.html';
                        return;
                    }
                    loadTrash();
                });

                return {
                    todoList,
                    filteredtodoList,
                    loading,
                    msgDialog,
                    dialogMessage,
                    showDialog,
                    formatTime,
                    restoreItem,
                    permanentDelete,
                    resetDeleteTip,
                    goBack
                };
            }
        }).mount('#app');
    </script>

</body>

</html>
