<!-- login.html -->

<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 检查清单系统</title>
    <link rel="shortcut icon" href="./assets/images/favicon.ico" type="image/x-icon">
    <link rel="icon" sizes="32x32" href="./assets/images/favicon.ico">

    <style>
        /* 彻底夺回所有交互权限 */
        body,
        #app,
        form,
        input,
        select,
        button,
        a {
            -webkit-app-region: no-drag !important;
            -webkit-user-select: text !important;
        }

        body {
            font-family: sans-serif;
            background: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-container {
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 300px;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #3498db;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
        }

        /* 新增：Dialog 样式 */
        dialog {
            border: none;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        dialog::backdrop {
            background: rgba(0, 0, 0, 0.3);
        }

        dialog button {
            margin-top: 15px;
            background: #3498db;
        }
    </style>
</head>

<body>
    <div id="app" class="login-container">
        <h2>{{ isUsernameLogin ? '用户名登录' : 'ID 登录' }}</h2>

        <!-- 💡 快速选择本地已有账号的下拉框（选择即自动跳转） -->
        <div v-if="discoveredUserIds.length > 0" style="margin-bottom: 10px;">
            <select v-model="selectedQuickUser" @change="handleQuickSelect">
                <option disabled value="">-- 快速切换本地账号 --</option>
                <option v-for="id in discoveredUserIds" :key="id" :value="id">
                    账号: {{ id }}
                </option>
            </select>
        </div>

        <form @submit.prevent="login">
            <input ref="inputField" v-model="loginForm.account" type="text"
                :placeholder="isUsernameLogin ? '用户名' : '用户ID'">
            <input name="loginPassword" v-model="loginForm.password" type="password" placeholder="密码">
            <button type="submit" :disabled="isLoading">{{ isLoading ? '登录中...' : '登录' }}</button>
        </form>

        <p @click="toggleLogin" style="cursor:pointer; color:#3498db; text-align:center; font-size:15px;">
            {{ isUsernameLogin ? '切换到ID登录' : '切换到用户名登录' }}
        </p>

        <div style="margin-top: 15px; text-align: center; font-size: 14px; color: #666;">
            还没有账号？<a href="./register.html" style="color: #3498db;">立即注册</a>
        </div>

        <!-- 新增：对话框组件 -->
        <dialog ref="msgDialog">
            <p>{{ dialogMessage }}</p>
            <button @click="$refs.msgDialog.close()">确定</button>
        </dialog>

    </div>

    <script src="https://unpkg.com/vue@3.5.40/dist/vue.global.js"></script>
    <script src="https://unpkg.com/axios@1.7.2/dist/axios.min.js"></script>
    <script src="js/api.js"></script>

    <script>
        const { createApp, reactive, ref, onMounted } = Vue;

        createApp({
            setup() {
                const loginForm = reactive({
                    account: '', // 统一接收用户名或 ID
                    password: ''
                });
                const isUsernameLogin = ref(false); // 默认 ID 登录
                const isLoading = ref(false); // 💡 状态

                // 快速登录相关变量
                const selectedQuickUser = ref('');
                const discoveredUserIds = ref([]);

                // 下拉框选中后直接免密跳转到 index.html
                const handleQuickSelect = () => {
                    if (!selectedQuickUser.value) return;

                    const chosenId = String(selectedQuickUser.value);
                    localStorage.setItem('userId', chosenId);

                    // 确保被选中的账号也同步在 logged_users 里面
                    let users = [];
                    try {
                        users = JSON.parse(localStorage.getItem('logged_users') || '[]');
                    } catch (e) {
                        users = [];
                    }
                    if (!users.includes(chosenId)) {
                        users.push(chosenId);
                        localStorage.setItem('logged_users', JSON.stringify(users));
                    }

                    // 直接跳转
                    window.location.href = 'index.html';
                };

                // 对话框相关逻辑
                const msgDialog = ref(null);
                const dialogMessage = ref("");
                const showDialog = (msg) => {
                    dialogMessage.value = msg;
                    msgDialog.value.showModal();
                };

                // 获取全局 api 实例
                const request = window.api;

                // 登录提交
                const login = async () => {
                    // 根据当前模式选择发送的字段
                    const payload = isUsernameLogin.value
                        ? { username: loginForm.account, password: loginForm.password }
                        : { id: loginForm.account, password: loginForm.password };

                    if (!payload.password || (!payload.id && !payload.username)) {
                        return showDialog("请填写完整");
                    }

                    isLoading.value = true; // 💡 设置加载状态

                    try {
                        const res = await request.post('/auth/login', payload);
                        if (res.data.code === 200) {
                            // 修正：先正确获取登录后的 id，再写入 localStorage 和 logged_users
                            const loggedId = String(res.data.data.id || loginForm.account);
                            localStorage.setItem('userId', loggedId);

                            // 同步更新到全局已登录账号池中
                            let users = [];
                            try {
                                users = JSON.parse(localStorage.getItem('logged_users') || '[]');
                            } catch (e) {
                                users = [];
                            }
                            if (!users.includes(loggedId)) {
                                users.push(loggedId);
                                localStorage.setItem('logged_users', JSON.stringify(users));
                            }

                            window.location.href = 'index.html';
                        } else {
                            showDialog(res.data.message);
                        }
                    } catch (e) {
                        // 1. 判断是否是 Axios 请求错误（即有响应但非 2xx 状态码）
                        if (e.response) {
                            const { status, data } = e.response;

                            // 2. 根据状态码给予更准确的反馈
                            if (status === 401) {
                                showDialog("登录失败: ID 或密码不正确");
                            } else if (status === 404) {
                                showDialog("登录失败: 登录接口不存在，请检查后端路径");
                            } else if (data && data.message) {
                                // 如果后端返回了标准的错误对象（如 {code: 500, message: "xxx"}）
                                showDialog("错误: " + data.message);
                            } else {
                                showDialog(`请求错误 (状态码: ${status})`);
                            }
                        } else if (e.request) {
                            // 3. 请求发出去了，但没收到响应（可能是网络断了或后端服务崩溃）
                            showDialog("无法连接到服务器，请检查网络或后端是否启动");
                        } else {
                            // 4. 其他代码逻辑错误
                            console.error("代码运行错误:", e);
                            showDialog("系统异常，请查看控制台日志");
                        }
                    } finally {
                        isLoading.value = false; // 💡 无论成功失败，恢复按钮状态
                    }
                };

                // 封装一个公共的聚焦函数
                let focusTimer = null;
                const focusInput = () => {
                    // 💡 新增：强制聚焦到输入框
                    if (focusTimer) clearTimeout(focusTimer);
                    focusTimer = setTimeout(() => {
                        inputField.value?.focus();
                    }, 300); // 延迟，确保数据加载完成且 DOM 渲染完毕
                };

                // 在 onMounted 中调用，确保页面加载即聚焦
                onMounted(() => {
                    // 页面加载时扫描本地账号
                    discoveredUserIds.value = window.scanLocalUserIds();
                    focusInput();
                });

                // 切换登录方式的方法
                const toggleLogin = () => {
                    isUsernameLogin.value = !isUsernameLogin.value;
                    // 切换时清空对应的值（视业务需求而定）
                    loginForm.account = '';
                    focusInput();
                };

                return {
                    loginForm,
                    isUsernameLogin,
                    isLoading,
                    login,
                    toggleLogin,
                    msgDialog,
                    dialogMessage,
                    selectedQuickUser,
                    discoveredUserIds,
                    handleQuickSelect
                };
            }
        }).mount('#app');
    </script>
</body>

</html>
