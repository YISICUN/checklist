<!-- login.html -->

<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 检查清单系统</title>
    <link rel="shortcut icon" href="./assets/images/favicon.ico" type="image/x-icon">
    <link rel="icon" sizes="32x32" href="./assets/images/favicon.ico">

    <style>
        /* 彻底夺回所有交互权限 */
        body,
        #app,
        form,
        input,
        select,
        button,
        a {
            -webkit-app-region: no-drag !important;
            -webkit-user-select: text !important;
        }

        body {
            font-family: sans-serif;
            background: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-container {
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 300px;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #3498db;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
        }

        /* 新增：Dialog 样式 */
        dialog {
            border: none;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        dialog::backdrop {
            background: rgba(0, 0, 0, 0.3);
        }

        dialog button {
            margin-top: 15px;
            background: #3498db;
        }
    </style>
</head>

<body>
    <div id="app" class="login-container">
        <h2>{{ isUsernameLogin ? '用户名登录' : 'ID 登录' }}</h2>

        <!-- 💡 快速选择本地已有账号的下拉框（选择即自动跳转） -->
        <div v-if="discoveredUserIds.length > 0" style="margin-bottom: 10px;">
            <select v-model="selectedQuickUser" @change="handleQuickSelect">
                <option disabled value="">-- 快速切换本地账号 --</option>
                <option v-for="id in discoveredUserIds" :key="id" :value="id">
                    账号: {{ id }}
                </option>
            </select>
        </div>

        <form @submit.prevent="login">
            <input name="loginUsername" ref="userField" v-if="isUsernameLogin" v-model="loginForm.username" type="text"
                placeholder="用户名">
            <input name="loginId" ref="idField" v-else v-model="loginForm.id" type="text" placeholder="用户ID">

            <input name="loginPassword" v-model="loginForm.password" type="password" placeholder="密码">

            <button type="submit" :disabled="isLoading">{{ isLoading ? '登录中...' : '登录' }}</button>
        </form>

        <p @click="toggleLogin" style="cursor:pointer; color:#3498db; text-align:center; font-size:15px;">
            {{ isUsernameLogin ? '切换到ID登录' : '切换到用户名登录' }}
        </p>

        <div style="margin-top: 15px; text-align: center; font-size: 14px; color: #666;">
            还没有账号？<a href="./register.html" style="color: #3498db;">立即注册</a>
        </div>

        <!-- 新增：对话框组件 -->
        <dialog ref="msgDialog">
            <p>{{ dialogMessage }}</p>
            <button @click="$refs.msgDialog.close()">确定</button>
        </dialog>

    </div>

    <script src="https://unpkg.com/vue@3.5.40/dist/vue.global.js"></script>
    <script src="https://unpkg.com/axios@1.7.2/dist/axios.min.js"></script>
    <script src="js/api.js"></script>

    <script>
        const { createApp, reactive, ref, onMounted } = Vue;

        createApp({
            setup() {
                const loginForm = reactive({
                    id: '',
                    username: '', // 必须在这里先定义好
                    password: ''
                });
                const isUsernameLogin = ref(false); // 默认 ID 登录
                const isLoading = ref(false); // 💡 状态

                // 快速登录相关变量
                const selectedQuickUser = ref('');
                const discoveredUserIds = ref([]);

                // 💡 已增强：扫描本地出现过的所有 userId（支持读取 logged_users、userId 键、以及深度解析 JSON 内部的 userId）
                const scanLocalUserIds = () => {
                    const idSet = new Set();

                    // 1. 检查全局账号池记录
                    const storedUsers = localStorage.getItem('logged_users');
                    if (storedUsers) {
                        try {
                            const parsedUsers = JSON.parse(storedUsers);
                            if (Array.isArray(parsedUsers)) {
                                parsedUsers.forEach(id => idSet.add(String(id)));
                            }
                        } catch (e) { }
                    }

                    // 2. 检查当前的 userId
                    const currentUserId = localStorage.getItem('userId');
                    if (currentUserId) idSet.add(String(currentUserId));

                    // 3. 遍历整个 localStorage 键名和对应的值，深度提取隐藏的 userId
                    for (let i = 0; i < localStorage.length; i++) {
                        const key = localStorage.key(i);
                        const value = localStorage.getItem(key);

                        // 兼容命名格式：匹配下划线加数字结尾，如 _44, _1
                        const match1 = key.match(/_(\d+)$/);
                        if (match1 && match1[1]) {
                            idSet.add(match1[1]);
                        }

                        // 尝试解析 Value 是否为 JSON（对象或数组），如果是，则递归查找里面所有的 userId 字段
                        if (value && (value.startsWith('[') || value.startsWith('{'))) {
                            try {
                                const parsedData = JSON.parse(value);
                                const findUserIds = (obj) => {
                                    if (!obj || typeof obj !== 'object') return;
                                    for (let k in obj) {
                                        if (k === 'userId' && obj[k] !== undefined && obj[k] !== null) {
                                            idSet.add(String(obj[k]));
                                        } else if (typeof obj[k] === 'object') {
                                            findUserIds(obj[k]);
                                        }
                                    }
                                };
                                findUserIds(parsedData);
                            } catch (e) { }
                        }

                        // 匹配键名或包含的合理数字
                        const matchAllNums = key.match(/\d+/g);
                        if (matchAllNums) {
                            matchAllNums.forEach(num => {
                                if (num.length <= 6) {
                                    idSet.add(num);
                                }
                            });
                        }
                    }

                    // 转换为数字排序，让下拉框井井有条
                    discoveredUserIds.value = Array.from(idSet).sort((a, b) => Number(a) - Number(b));
                };

                // 下拉框选中后直接免密跳转到 index.html
                const handleQuickSelect = () => {
                    if (!selectedQuickUser.value) return;

                    const chosenId = String(selectedQuickUser.value);
                    localStorage.setItem('userId', chosenId);

                    // 确保被选中的账号也同步在 logged_users 里面
                    let users = [];
                    try {
                        users = JSON.parse(localStorage.getItem('logged_users') || '[]');
                    } catch (e) {
                        users = [];
                    }
                    if (!users.includes(chosenId)) {
                        users.push(chosenId);
                        localStorage.setItem('logged_users', JSON.stringify(users));
                    }

                    // 直接跳转
                    window.location.href = 'index.html';
                };

                // 对话框相关逻辑
                const msgDialog = ref(null);
                const dialogMessage = ref("");
                const showDialog = (msg) => {
                    dialogMessage.value = msg;
                    msgDialog.value.showModal();
                };

                // 获取全局 api 实例
                const request = window.api;

                const login = async () => {
                    // 根据当前模式选择发送的字段
                    const payload = isUsernameLogin.value
                        ? { username: loginForm.username, password: loginForm.password }
                        : { id: loginForm.id, password: loginForm.password };

                    if (!payload.password || (!payload.id && !payload.username)) {
                        return showDialog("请填写完整");
                    }

                    isLoading.value = true; // 💡 设置加载状态

                    try {
                        const res = await request.post('/auth/login', payload);
                        if (res.data.code === 200) {
                            // 修正：先正确获取登录后的 id，再写入 localStorage 和 logged_users
                            const loggedId = String(res.data.data.id || (isUsernameLogin.value ? loginForm.username : loginForm.id));
                            localStorage.setItem('userId', loggedId);

                            // 同步更新到全局已登录账号池中
                            let users = [];
                            try {
                                users = JSON.parse(localStorage.getItem('logged_users') || '[]');
                            } catch (e) {
                                users = [];
                            }
                            if (!users.includes(loggedId)) {
                                users.push(loggedId);
                                localStorage.setItem('logged_users', JSON.stringify(users));
                            }

                            window.location.href = 'index.html';
                        } else {
                            showDialog(res.data.message);
                        }
                    } catch (e) {
                        // 1. 判断是否是 Axios 请求错误（即有响应但非 2xx 状态码）
                        if (e.response) {
                            const { status, data } = e.response;

                            // 2. 根据状态码给予更准确的反馈
                            if (status === 401) {
                                showDialog("登录失败: ID 或密码不正确");
                            } else if (status === 404) {
                                showDialog("登录失败: 登录接口不存在，请检查后端路径");
                            } else if (data && data.message) {
                                // 如果后端返回了标准的错误对象（如 {code: 500, message: "xxx"}）
                                showDialog("错误: " + data.message);
                            } else {
                                showDialog(`请求错误 (状态码: ${status})`);
                            }
                        } else if (e.request) {
                            // 3. 请求发出去了，但没收到响应（可能是网络断了或后端服务崩溃）
                            showDialog("无法连接到服务器，请检查网络或后端是否启动");
                        } else {
                            // 4. 其他代码逻辑错误
                            console.error("代码运行错误:", e);
                            showDialog("系统异常，请查看控制台日志");
                        }
                    } finally {
                        isLoading.value = false; // 💡 无论成功失败，恢复按钮状态
                    }
                };

                // 自动聚焦
                const userField = ref(null);
                const idField = ref(null);

                // 2. 封装一个公共的聚焦函数
                const focusInput = () => {
                    // 💡 新增：强制聚焦到输入框
                    setTimeout(() => {
                        if (isUsernameLogin.value) {
                            userField.value?.focus();
                        } else {
                            idField.value?.focus();
                        }
                    }, 500); // 延迟 500ms，确保数据加载完成且 DOM 渲染完毕
                };


                // 3. 在 onMounted 中调用，确保页面加载即聚焦
                onMounted(() => {
                    scanLocalUserIds(); // 页面加载时扫描本地账号
                    focusInput();
                });

                // 切换登录方式的方法
                const toggleLogin = () => {
                    isUsernameLogin.value = !isUsernameLogin.value;
                    focusInput();
                };

                return {
                    loginForm,
                    isUsernameLogin,
                    isLoading,
                    login,
                    userField,
                    idField,
                    focusInput,
                    toggleLogin,
                    msgDialog,
                    dialogMessage,
                    selectedQuickUser,
                    discoveredUserIds,
                    handleQuickSelect
                };
            }
        }).mount('#app');
    </script>
</body>

</html>
