<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>我我的待办事项清单 (Vue3 响应式版)</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f7f6;
            margin: 40px;
            color: #333;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h2 {
            border-bottom: 2px solid #2ecc71;
            padding-bottom: 10px;
            color: #2c3e50;
        }

        .item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            margin: 8px 0;
            background: #fafafa;
            border-radius: 4px;
            border-left: 4px solid #3498db;
            transition: all 0.3s ease;
            /* 增加平滑过渡效果 */
        }

        /* 状态为已完成时的卡片样式 */
        .completed {
            border-left-color: #bdc3c7;
            background: #f0f0f0;
        }

        /* 状态为已完成时的文字删除线 */
        .completed .title {
            text-decoration: line-through;
            color: #7f8c8d;
        }

        button {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background: #c0392b;
        }

        /* 复选框样式微调 */
        .todo-checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
            margin-right: 12px;
        }
    </style>
</head>

<body>

    <div id="app" class="container">
        <h2>📋 我的待办事项清单</h2>

        <div style="margin-bottom: 20px;">
            <input type="text" v-model.trim="newTodoTitle" @keyup.enter="addTodo" placeholder="输入新的待办任务..."
                style="padding: 8px; width: 70%;">
            <button @click="addTodo" style="background: #2ecc71; margin-left: 8px;">添加任务</button>
        </div>

        <div id="todo-list">
            <p v-if="loading" style="color: #3498db;">正在加载云端数据...</p>

            <p v-else-if="todoList.length === 0" style="color: #7f8c8d;">目前没有任务，快去添加一个吧！</p>

            <div v-else v-for="item in todoList" :key="item.id" class="item"
                :class="{ completed: item.isCompleted === 1 }">

                <div style="display: flex; align-items: center; flex: 1;">
                    <input type="checkbox" class="todo-checkbox" v-model="item.isCompleted" :true-value="1"
                        :false-value="0" @change="handleStatusToggle(item)" />

                    <span class="title" @click="updateTodoTitle(item)" style="cursor:pointer; flex: 1;">
                        <strong>{{ item.title }}</strong>
                    </span>
                </div>

                <div style="margin-left: auto; display: flex; gap: 10px;">
                    <button @click="updateTodoTitle(item)" style="background: #3498db;">修改</button>
                    <button @click="deleteTodo(item.id)">删除</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted } = Vue;

        // 后端基础 API 路径
        const BASE_URL = 'https://checklist-backend-bqsf.onrender.com/api/item';

        createApp({
            setup() {
                // 定义响应式状态
                const todoList = ref([]);
                const newTodoTitle = ref('');
                const loading = ref(true);

                // 🔍 查询全件 (GET)
                const loadTodos = async () => {
                    loading.value = true;
                    try {
                        const response = await axios.get(`${BASE_URL}/list`);
                        if (response.data.code === 200) {
                            todoList.value = response.data.data;
                        } else {
                            alert('数据加载失败：' + response.data.message);
                        }
                    } catch (err) {
                        console.error(err);
                        alert('无法连接到后端服务，请确认后端已启动！');
                    } finally {
                        loading.value = false;
                    }
                };

                // 💡 添加任务 (POST)
                const addTodo = async () => {
                    if (!newTodoTitle.value) return alert('任务名不能为空！');

                    try {
                        const response = await axios.post(`${BASE_URL}/add`, {
                            title: newTodoTitle.value,
                            isCompleted: 0
                        });
                        if (response.data.code === 200) {
                            newTodoTitle.value = ''; // 清空输入框
                            await loadTodos();       // 刷新列表
                        } else {
                            alert('添加失败: ' + response.data.message);
                        }
                    } catch (err) {
                        console.error(err);
                    }
                };

                // 🔄 关键：Checkbox 状态触发变更 (POST/PUT)
                // 对应你之前提及的前后端数据模型转换逻辑
                const handleStatusToggle = async (item) => {
                    try {
                        // 依据你的后端实现，这里将整条 item（包含最新的 isCompleted 数字）传给后端
                        const response = await axios.post(`${BASE_URL}/update`, {
                            id: item.id,
                            title: item.title,
                            isCompleted: item.isCompleted // 此时值已经是自动转换好的 1 或 0
                        });

                        if (response.data.code !== 200) {
                            alert('状态更新失败: ' + response.data.message);
                            // 冗余安全设计（回滚）：后端若失败，前端状态倒腾回去
                            item.isCompleted = item.isCompleted === 1 ? 0 : 1;
                        }
                    } catch (err) {
                        console.error('网络请求失败，状态回滚', err);
                        item.isCompleted = item.isCompleted === 1 ? 0 : 1;
                    }
                };

                // 📝 修改任务文本内容 (POST)
                const updateTodoTitle = async (item) => {
                    const newTitle = prompt("修改任务内容:", item.title);
                    if (newTitle === null || newTitle === item.title || newTitle.trim() === '') return;

                    try {
                        const response = await axios.post(`${BASE_URL}/update`, {
                            id: item.id,
                            title: newTitle,
                            isCompleted: item.isCompleted
                        });
                        if (response.data.code === 200) {
                            await loadTodos(); // 刷新列表
                        } else {
                            alert('修改失败: ' + response.data.message);
                        }
                    } catch (err) {
                        console.error(err);
                    }
                };

                // 🗑️ 删除任务 (DELETE)
                const deleteTodo = async (id) => {
                    if (confirm('确定要斩断这条任务的因果（删除）吗？')) {
                        try {
                            const response = await axios.delete(`${BASE_URL}/delete/${id}`);
                            if (response.data.code === 200) {
                                await loadTodos(); // 刷新列表
                            } else {
                                alert(response.data.message);
                            }
                        } catch (err) {
                            console.error(err);
                        }
                    }
                };

                // 生命周期钩子：挂载完成时加载数据
                onMounted(() => {
                    loadTodos();
                });

                // 将模版需要使用的变量和函数暴露出去
                return {
                    todoList,
                    newTodoTitle,
                    loading,
                    addTodo,
                    handleStatusToggle,
                    updateTodoTitle,
                    deleteTodo
                };
            }
        }).mount('#app'); // 挂载容器
    </script>
</body>

</html>
