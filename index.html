<!-- index.html -->

<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <!-- 设置字符编码 -->
    <meta charset="UTF-8">

    <!-- 设置视口（用于响应式适配） -->
    <!-- HTML 规范要求每个 <meta> 标签有不同的职责。你需要把它们拆分成两个独立的标签。 -->
    <!-- viewport 指的是“视口”，也就是网页在设备屏幕上可见的区域。 -->
    <!-- width=device-width 含义：将视口的宽度设定为“设备的宽度”。 -->
    <!-- initial-scale=1.0 含义：设定页面的“初始缩放比例”为 1.0（即 1:1，不缩放）。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>检查清单 (Vue3 响应式版)</title>

    <!-- 引入外部样式文件 -->
    <link rel="stylesheet" href="./css/style.css">

    <!-- manifest.json（全称通常为 Web App Manifest）是一个简单的 JSON 文件，它是 PWA（渐进式网页应用，Progressive Web App） 技术的核心配置文件。 -->
    <!-- <link rel="manifest" href="./manifest.json"> -->

    <link rel="shortcut icon" href="./assets/images/favicon.ico" type="image/x-icon">
    <link rel="icon" sizes="32x32" href="./assets/images/favicon.ico">
</head>

<body>

    <div id="app" class="container">

        <div class="header-row">
            <h2 @click="loadTodos" class="app-title-style">📋 检查清单</h2>

            <!-- 💡 账号切换下拉框 -->
            <div style="display: flex; align-items: center; gap: 6px;">
                <span style="font-size: 13px; color: #666;">切换账号:</span>
                <select v-model="currentUserId" @change="handleUserSwitch" class="time-select-style"
                    style="padding: 4px 8px;">
                    <option v-for="id in discoveredUserIds" :key="id" :value="id">
                        ID: {{ id }} {{ id === currentUserId ? '(当前)' : '' }}
                    </option>
                </select>
            </div>

            <button @click="logout" class="logout-btn-style">
                退出登录
            </button>
        </div>

        <div class="category-tabs">
            <div v-for="cat in categories" :key="cat.id" @click="activeCategory = cat" class="category-item-base"
                :class="{ 'category-item-active': activeCategory.id === cat.id, 'category-item-normal': activeCategory.id !== cat.id }">
                {{ cat.name }}
            </div>
        </div>

        <!-- 🔍 带有清空按钮的白底搜索区域 -->
        <div class="search-box-wrapper">
            <input type="text" v-model.trim="searchKeyword" placeholder="🔍 搜索任务..." class="search-input-style">

            <!-- ❌ 一键清空按钮：输入文字时显示 -->
            <span v-if="searchKeyword" @click="searchKeyword = ''" class="clear-btn-style">
                ✕
            </span>

        </div>

        <!-- ➕ 带有清空按钮的添加任务表单 -->
        <div class="add-form-wrapper">
            <!-- 输入框包裹容器（相对定位，用于放置清空按钮） -->
            <div class="input-container-style">
                <input type="text" v-model.trim="newTodoTitle" @keyup.enter="addTodo" placeholder="✚ 输入新任务..."
                    class="search-input-style">

                <!-- ❌ 一键清空输入内容按钮：有文字时显示 -->
                <span v-if="newTodoTitle" @click="newTodoTitle = ''" class="clear-btn-style">
                    ✕
                </span>

            </div>

            <!-- 添加按钮 -->
            <button @click="addTodo" class="add-task-btn-style">添加任务</button>
        </div>

        <div id="todo-list">
            <p v-if="loading" class="loading-tip-style">正在加载云端数据...</p>

            <p v-else-if="filteredTodoList.length === 0" class="empty-tip-style">目前没有任务，快去添加一个吧！</p>
            <div v-else v-for="item in filteredTodoList" :key="item.id" class="item"
                :class="{ completed: item.isCompleted === 1, updating: item.isUpdating }">

                <div class="item-inner-row">
                    <input type="checkbox" class="todo-checkbox" v-model="item.isCompleted" :true-value="1"
                        :false-value="0" @change="handleStatusToggle(item)" />

                    <span class="title item-title-style" @click="updateTodoTitle(item)">
                        <strong>{{ item.title }}</strong>
                    </span>
                </div>

                <div class="item-actions-row">

                    <div class="time-selector">

                        <span v-if="item.dueDate === '2111-11-11'" class="daily-label">
                            <button type="button" @click.stop="openDateDialog(item)" class="daily-btn-style">
                                每日
                            </button>
                        </span>

                        <input v-else type="date" v-model="item.dueDate" @input="handleDateClear($event, item)"
                            class="date-input-style" />
                        <select v-model="item.startTime" @change="updateTime(item)" class="time-select-style">
                            <option v-for="time in timeOptions" :key="time" :value="time">{{ time }}</option>
                        </select>
                    </div>

                    <!-- <button @click="moveTask(item, 'top')" style="background: #3498db; padding: 2px 6px;">置顶</button> -->
                    <!-- <button @click="moveTask(item, 'up')" style="background: #3498db; padding: 2px 6px;">↑</button> -->
                    <!-- <button @click="moveTask(item, 'down')" style="background: #3498db; padding: 2px 6px;">↓</button> -->
                    <!-- <button @click="moveTask(item, 'bottom')" style="background: #3498db; padding: 2px 6px;">置底</button> -->

                    <button @click="openUpdateDialog(item)" class="action-btn-blue">改</button>
                    <button @click="deleteTodo(item.id)" class="action-btn-red">删</button>
                </div>
            </div>

            <div class="toolbar">
                <button @click="toggleAllStatus" class="toolbar-btn-style">
                    {{ filteredTodoList.some(i => i.isCompleted === 0) ? '全选已完成' : '全部重置' }}
                </button>

                <!-- 💡 新增：数据导出与导入按钮（隐藏的 file input 用于选择导入文件） -->
                <button @click="exportLocalStorage" class="toolbar-btn-style" style="background: #27ae60;">
                    📥 导出数据
                </button>
                <button @click="triggerImport" class="toolbar-btn-style" style="background: #e67e22;">
                    📤 导入数据
                </button>
                <input type="file" ref="fileInput" @change="importLocalStorage" accept=".json" style="display: none;" />

                <!-- 右侧新增的回收站按钮 -->
                <button onclick="window.location.href='trash.html'" class="trash-btn-style">
                    🗑️ 回收站
                </button>
            </div>

            <!-- 底部空白占位符，防止手机底栏遮挡 -->
            <div class="spacer-style"></div>

        </div>

        <!-- 💬 修改任务内容和分类的对话框 -->
        <dialog ref="updateDialog" class="dialog-base-style">
            <form method="dialog" @submit.prevent="updateDialogSubmit">
                <h3>修改任务</h3>
                <p>内容: <input v-model="tempTitle" type="text" class="dialog-input-style" /></p>
                <p>描述: <textarea v-model="tempDesc" class="dialog-input-style" rows="3"
                        style="resize: vertical;"></textarea></p>
                <p>分类:
                    <select v-model="tempCatId" class="dialog-input-style">
                        <option v-for="cat in dbCategories" :key="cat.id" :value="cat.id">{{ cat.name }}</option>
                    </select>
                </p>
                <div class="dialog-footer-style">
                    <button type="submit" class="dialog-submit-btn">确定</button>
                    <button type="button" @click="updateDialogCancel" class="dialog-cancel-btn">取消</button>
                </div>
            </form>
        </dialog>

        <!-- 日期修改对话框 -->
        <dialog ref="dateDialog" class="dialog-base-style">
            <form method="dialog" @submit.prevent="dateDialogSubmit">
                <h3>修改截止日期</h3>
                <p>输入日期 (YYYY-MM-DD):</p>
                <input v-model="tempDate" type="date" class="dialog-input-style" />
                <div class="dialog-footer-style">
                    <button type="submit" class="dialog-submit-btn">确定</button>
                    <button type="button" @click="dateDialogCancel" class="dialog-cancel-btn-ml">取消</button>
                </div>
            </form>
        </dialog>

        <!-- 💡 通用消息提示与确认对话框 -->
        <dialog ref="msgDialog" class="msg-dialog-style">
            <form method="dialog" @submit.prevent="msgDialogSubmit">
                <h3 class="msg-title-style">提示</h3>
                <p>{{ dialogMessage }}</p>

                <!-- 💡 新增：动态显示“下次不再提示”的复选框 -->
                <div v-if="isConfirmMode && showDontAskAgain" class="dont-ask-wrapper">
                    <label class="dont-ask-label">
                        <input type="checkbox" v-model="dontAskAgainChecked" class="dont-ask-checkbox" />
                        下次不再提示
                    </label>
                </div>

                <div class="msg-footer-style">
                    <button type="submit" class="msg-confirm-btn">确定</button>
                    <button v-if="isConfirmMode" type="button" @click="msgDialogCancel"
                        class="msg-cancel-btn">取消</button>
                </div>
            </form>
        </dialog>

    </div>

    <script src="https://unpkg.com/vue@3.5.40/dist/vue.global.js"></script>
    <script src="https://unpkg.com/axios@1.7.2/dist/axios.min.js"></script>

    <!-- 引入封装好的 API 模块 -->
    <script src="js/api.js"></script>

    <!-- 引入外部逻辑文件 -->
    <script src="js/app.js"></script>
</body>

</html>
